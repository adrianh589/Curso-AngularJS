<h1>
    <i class="fa-solid fa-user-astronaut"></i>
    Alumno
</h1>

<h4>{{ alumno.nombre }}</h4>
<hr>

<div class="row">
    <form ng-submit="guardarAlumno()">

        <div ng-hide="creando">
            Codigo:
            <br>
            <input type="text" class="form-control" ng-model="alumno.codigo" readonly>
            <br>
        </div>

        Nombre:
        <br>
        <input type="text" class="form-control" ng-model="alumno.nombre" required placeholder="Nombre del alumno">
        <br>

        Telefono:
        <br>
        <input type="text" class="form-control" ng-model="alumno.telefono" ui-mask="{{telefonoMask}}" required>
        <br>

        Direccion:
        <br>
        <textarea class="form-control" ng-model="alumno.direccion" rows="5" required placeholder="Direccion del alumno"></textarea>
        <br>

        <button class="btn btn-primary" type="submit">
            <i class="fa-regular fa-floppy-disk"></i>
            Guardar Cambios
        </button>

        <br>
        <br>

        <p ng-show="actualizado" class="text-success animated fadeIn fast">
            Alumno actualizado correctamente
        </p>
    </form>
</div>
