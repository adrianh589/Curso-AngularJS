<!DOCTYPE html>
<html ng-app="bonusApp" ng-controller="mainCtrl">
    <head>
        <meta charset="utf-8">
        <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0' name='viewport' />

        <title>Bonus 02 - SweetAlert</title>


        <!-- Incluir Bootstrap -->
        <link rel="stylesheet" href="css/bootstrap.min.css">

        <!-- Animate.css -->
        <link rel="stylesheet" href="css/animate.css">

        <!-- Sweet alert 1 -->
        <link rel="stylesheet" href="plugins/sweetalert1/sweetalert.css">

        <!-- Font Awesome -->
        <link rel="stylesheet" href="font-awesome/css/font-awesome.min.css">

        <!-- Incluir AngularJS -->
        <script src="js/lib/angular.min.js"></script>
        <script src="js/app.js"></script>

        <!-- Incluir sweet alert 1 -->
        <script src="plugins/sweetalert1/sweetalert.min.js"></script>

    </head>    
    <body>
        
        <div class="container">
            <h1>Sweet Alert</h1>
            <h2> {{ borradoMensaje }} </h2>
            <hr>
            
            <div class="col-sm-2">
                
                <button class="btn btn-primary" ng-click="mostrarAlerta()">
                    Alerta
                </button>

                <button class="btn btn-primary" ng-click="mostrarSubtitulo()">
                    Alerta con sub
                </button>

                <button class="btn btn-danger" ng-click="mostrarConfirmacion()">
                    Confirmación
                </button>

                <button class="btn btn-info" ng-click="mostrarInput()">
                    Input text
                </button>
                
            </div>





            

        </div>
        
    </body>
</html>
